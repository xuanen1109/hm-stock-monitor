name: 台股 AI 監控 - 每日爬蟲 + 推送

# 觸發時機
on:
  schedule:
    # 盤前 8:30 (UTC+8，所以是 UTC 0:30)
    - cron: '30 0 * * 1-5'
    # 盤後 4:30 (UTC+8，所以是 UTC 20:30)
    - cron: '30 20 * * 1-5'
  
  # 允許手動觸發
  workflow_dispatch:

jobs:
  stock-news-pipeline:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: 📥 Checkout 代碼庫
        uses: actions/checkout@v4
      
      - name: 🐍 設置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 📦 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser
      
      - name: 🚀 執行爬蟲 + 過濾
        run: |
          python stock_scraper_v2.py
        env:
          FINMIND_API_KEY: ${{ secrets.FINMIND_API_KEY }}
      
      - name: 📤 上傳到 Firebase Firestore
        run: |
          python push_to_firebase.py
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      
      - name: 💬 推送通知到 LINE
        run: |
          python notify_line.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      
      - name: 📊 上傳工作流程工件
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: filtered-news-${{ github.run_number }}
          path: |
            filtered_news.json
            execution_log.txt
          retention-days: 30